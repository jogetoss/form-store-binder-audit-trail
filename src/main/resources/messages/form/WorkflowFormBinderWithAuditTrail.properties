WorkflowFormBinderWithAuditTrail.name=Workflow Form Binder with Audit Trail
WorkflowFormBinderWithAuditTrail.desc=Stores parent row changes in separate table
WorkflowFormBinderWithAuditTrail.config=Save Data To (Workflow Form Binder with Audit Trail)
WorkflowFormBinderWithAuditTrail.auditTrailForm=Audit Trail Form
WorkflowFormBinderWithAuditTrail.jsonDataField=Json Data Field
WorkflowFormBinderWithAuditTrail.textualDataField=Textual Data Field
WorkflowFormBinderWithAuditTrail.textualDataFieldDescription=Optional. Column on the audit trail form to store the plain-text diff. Leave blank to skip generating it.
WorkflowFormBinderWithAuditTrail.summaryField=Summary Field
WorkflowFormBinderWithAuditTrail.summaryFieldDescription=Optional. Column on the audit trail form to store a human-readable summary of the changes, rendered from the Summary Template below. Leave blank to skip generating a summary.
WorkflowFormBinderWithAuditTrail.summaryTemplate=Summary Template
WorkflowFormBinderWithAuditTrail.summaryTemplateDescription=Optional HTML template rendered into the Summary Field above - a human-readable description of what changed, not a popup. Leave both blank to skip generating a summary.<br/><br/>Supports Joget hash variables (e.g. <code>#currentUser.fullName#</code>), processed once against the whole template before anything else. Wrap a block in <code>&lt;foreach&gt;...&lt;/foreach&gt;</code> to repeat it once per changed field, with <code>{xxx}</code> placeholders substituted per field - text outside that block is emitted once, unchanged.<br/><br/>Available placeholders (only valid inside &lt;foreach&gt;...&lt;/foreach&gt;):<br/><pre>{fieldID}              - the field's element ID, e.g. "tags"\n{fieldLabel}           - the field's label, e.g. "Tags"\n{beforeContentValue}   - value before the change, label-resolved for lookup/option fields\n{afterContentValue}    - value after the change, label-resolved for lookup/option fields\n{beforeContentID}      - raw before value; blank unless this is a lookup/option field\n{afterContentID}       - raw after value; blank unless this is a lookup/option field</pre>Example:<br/><pre>&lt;b&gt;#currentUser.fullName#&lt;/b&gt; updated:-\n&lt;foreach&gt;\n&lt;br/&gt;&lt;b&gt;{fieldLabel}&lt;/b&gt; to "{afterContentValue}" from "{beforeContentValue}".\n&lt;/foreach&gt;</pre>
WorkflowFormBinderWithAuditTrail.foreignKey=Foreign Key
WorkflowFormBinderWithAuditTrail.foreignKeyDescription=To store parent form ID
WorkflowFormBinderWithAuditTrail.from=From (Current Form)
WorkflowFormBinderWithAuditTrail.to=To (Audit Trail Form)
WorkflowFormBinderWithAuditTrail.includeCopiedFieldInDiff=Include Copied Field in Diff
WorkflowFormBinderWithAuditTrail.includeCopiedFieldInDiffDescription=The new value of the "From" field is already copied into the "To" column of the audit trail record, check to also include in the JSON/textual diff log.
WorkflowFormBinderWithAuditTrail.formDefId= Current Form
WorkflowFormBinderWithAuditTrail.tracksEverything=Always Log Save
WorkflowFormBinderWithAuditTrail.tracksEverythingDescription=Insert a new audit trail record for every change, even if the field values are the same. If unchecked, only changes to the "From" fields will be logged.
WorkflowFormBinderWithAuditTrail.config.header= Copy Parent Field Value to Audit Trail Field